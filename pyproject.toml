[project]
name = "codex-voice-agent"
version = "2026.11.1.1"
description = "Voice-enabled Codex session in the Omarchy bar"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiortc>=1.15",
    "numpy>=2.0",
    # Renders Codex Markdown for the panel (render.py); pinned so the safety-checked output
    # cannot change under an install.
    "markdown-it-py==4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
codex-voice-agent = "codex_voice_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
